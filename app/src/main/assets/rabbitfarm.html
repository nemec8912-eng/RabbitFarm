<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11231b"><title>RabbitFarm — Моя кролеферма</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#ebf6ee;background:#0b1511}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 5%,#203d2c 0%,transparent 45%),#0b1511;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#102018;border-right:1px solid #2a4536;padding:28px 18px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:24px;letter-spacing:-.9px}.logo{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:#236e42;color:#d6ffdc;font-size:25px}.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:1px;color:#9db2a5}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:#adbeaf;padding:13px;border-radius:12px;width:100%}.nav button.active,.nav button:hover{background:#255d3d;color:#f4fff5}.nav .symbol{font-size:19px;width:24px;text-align:center}.sidefoot{margin-top:auto;padding:14px;border:1px solid #2d4c39;border-radius:12px;color:#a0bba8;font-size:12px;line-height:1.5}.main{padding:34px 34px 65px;max-width:1490px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}h1{margin:0;font-size:31px;letter-spacing:-.8px}h2{font-size:20px;margin:0 0 17px}h3{margin:0 0 10px;font-size:16px}.muted{color:#9baea2;font-size:13px}.muted p{margin:5px 0}.btn{background:#214432;color:#f0fff3;border:1px solid #39674d;border-radius:11px;padding:11px 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650}.primary{background:linear-gradient(130deg,#35bd6d,#20834a);border-color:#3ac672;color:white;box-shadow:0 5px 22px #14783c44}.btn:hover{filter:brightness(1.13)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.stat,.panel,.tile{border:1px solid #2b4436;background:linear-gradient(150deg,#172d21ee,#122218);border-radius:17px}.stat{padding:20px}.stat strong{display:block;font-size:33px;margin:12px 0 3px;color:#e4fae9}.stat small{color:#a9c1ad}.miniicon{width:40px;height:40px;display:grid;place-items:center;background:#1f5134;border-radius:11px;color:#64e69c;font-size:21px}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px}.panel{padding:21px;margin-bottom:16px}.sectionrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionrow .muted{margin:0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#1b3425;border:1px solid #355b41;color:#cbdfcf;padding:8px 12px;border-radius:10px;font-size:13px}.chip.active{background:#2f784a;border-color:#5fe08e;color:white}.item{padding:13px 0;border-top:1px solid #2b4436;display:flex;align-items:center;gap:12px}.item:first-child{border-top:0}.avatar{height:46px;width:46px;background:#284c33;border:1px solid #416a4a;border-radius:14px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.item .detail{flex:1;min-width:0}.item b{display:block}.item small{display:block;color:#a0b7a4;line-height:1.6}.pill{color:#a1efbd;background:#1e4930;border-radius:30px;padding:6px 10px;font-size:12px;white-space:nowrap}.pill.orange{background:#583d21;color:#ffd08f}.pill.red{background:#542c2b;color:#ffd5c6}.empty{padding:43px 14px;text-align:center;color:#aac7b4}.empty .em{font-size:43px;margin-bottom:10px}.empty b{display:block;color:#e6f5e9;margin-bottom:8px}.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#bbd0c0}.field input,.field select,.field textarea,.search{width:100%;min-width:0;background:#0c1b13;color:#effff1;padding:12px;border:1px solid #355a41;border-radius:10px;outline:0}.field textarea{min-height:84px;resize:vertical}.span2{grid-column:span 2}.searchbox{display:flex;gap:9px;margin:10px 0 14px}.search{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.tagline{font-size:12px;color:#89ad96;margin:10px 0 0}.banner{border:1px solid #335b3d;border-radius:14px;padding:19px 20px;background:linear-gradient(105deg,#24583b,#193225);display:flex;align-items:center;justify-content:space-between;gap:15px;margin:16px 0}.banner strong{font-size:19px}.banner p{margin:5px 0;color:#b6d7bd;font-size:13px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:12px;border-bottom:1px solid #34503b;text-align:left}.table th{color:#9fbbab;font-size:12px;font-weight:600}.note{border:1px dashed #537657;border-radius:12px;background:#192e20;padding:14px;color:#c6d6c9;font-size:13px}.footer{text-align:center;color:#799586;font-size:12px;margin-top:40px}.mobile-only{display:none}dialog{border:1px solid #477659;background:#14281d;color:#eef9ef;border-radius:18px;padding:25px;width:min(92vw,580px);box-shadow:0 15px 80px #000a}dialog::backdrop{background:#030c08cb}dialog h2{margin-bottom:18px}.right{margin-left:auto}.warning{color:#ffcba2}.alert{color:#f1bb91}.hint{margin-top:8px;color:#b9d2bb;font-size:13px}.hidden{display:none!important}@media(max-width:1100px){.app{grid-template-columns:200px 1fr}.main{padding:28px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:740px){.app{display:block}.sidebar{padding:12px 12px 10px;gap:11px;position:sticky;top:0;z-index:5;box-shadow:0 7px 15px #0008}.brand{font-size:17px}.brand .logo{height:34px;width:34px;font-size:20px}.nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:3px}.nav button{white-space:nowrap;flex:0 0 auto;padding:9px 11px;font-size:12px}.nav .symbol{display:none}.sidefoot{display:none}.main{padding:21px 13px 40px}.top{align-items:center}h1{font-size:24px}.stats{gap:8px;margin:16px 0}.stat{padding:13px}.stat strong{font-size:26px;margin:6px 0}.stat small{font-size:11px}.panel{padding:15px}.forms{grid-template-columns:1fr}.span2{grid-column:span 1}.banner{flex-direction:column;align-items:flex-start}} @media(max-width:700px){.sidefoot{display:none}.sidebar{padding:10px 6px}.nav button{font-size:12px;min-width:86px}.main{padding:20px 14px 95px}} </style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="logo">🐇</span><span>RabbitFarm<small>УЧЁТ КРОЛИКОВ</small></span></div><nav class="nav" id="nav"></nav><div class="sidefoot">● RabbitFarm 2.0<br>Данные хранятся на устройстве.<br>Делайте резервные копии.</div></aside><main class="main" id="main"></main></div>
<dialog id="dlg"><div id="dialog-content"></div><div class="actions"><button class="btn right" onclick="document.getElementById('dlg').close()">Закрыть</button></div></dialog>
<script>
'use strict';
const TABS=[['home','▦','Главная'],['adults','♧','Взрослые'],['young','◈','Молодняк'],['matings','♡','Вязки'],['sold','₽','Продано'],['meat','▣','На мясо'],['death','–','Падёж'],['all','◷','За всё время']];
const KEY='rabbitfarm_modern_v2';let tab='home',genderFilter='Все',search='';const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
let data={rabbits:[],litters:[],matings:[],records:[]};try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.rabbits)&&Array.isArray(x.litters)){data={rabbits:x.rabbits,litters:x.litters,matings:x.matings||[],records:x.records||[]}}}catch{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);const days=d=>d?Math.floor((new Date(today())-new Date(d))/86400000):null;const russian=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU'):'—';
const isActive=r=>r.status==='В хозяйстве';const rabbits=()=>data.rabbits.filter(isActive);const litters=()=>data.litters.filter(l=>l.count>0);const adults=()=>rabbits().length;const youngCount=()=>litters().reduce((sum,l)=>sum+l.count,0);
const row=(title,sub,badge='',cls='',action='')=>`<div class="item"><span class="avatar">🐇</span><div class="detail"><b>${esc(title)}</b><small>${esc(sub)}</small></div>${badge?`<span class="pill ${cls}">${esc(badge)}</span>`:''}${action}</div>`;
const empty=(title,desc,action='',fn='')=>`<div class="empty"><div class="em">🐇</div><b>${esc(title)}</b><p>${esc(desc)}</p>${action?`<button class="btn primary" onclick="${fn}">${esc(action)}</button>`:''}</div>`;
function stat(icon,title,num,description=''){return `<div class="stat"><div class="miniicon">${icon}</div><strong>${num}</strong><small>${esc(title)}</small>${description?`<div class="tagline">${esc(description)}</div>`:''}</div>`}
function header(title,sub,action='',fn=''){return `<div class="top"><div><h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p></div>${action?`<button class="btn primary" onclick="${fn}">＋ ${esc(action)}</button>`:''}</div>`}
function menu(){document.getElementById('nav').innerHTML=TABS.map(([id,ic,title])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span class="symbol">${ic}</span>${title}</button>`).join('')}
function go(t){tab=t;search='';render()}
function render(){menu();const root=document.getElementById('main');root.innerHTML=({home:home,adults:adultView,young:youngView,matings:matingView,sold:()=>historyView('Продано'),meat:()=>historyView('На мясо'),death:()=>historyView('Падёж'),all:allView})[tab]();}
function home(){const female=rabbits().filter(x=>x.sex==='Самка').length,male=adults()-female,need=litters().filter(l=>!l.separated&&days(l.born)>=45);
return `${header('Моя кролеферма','Добро пожаловать! Краткая статистика поголовья')}
<div class="stats">${stat('🐇','Всего сейчас',adults()+youngCount())}${stat('♀','Самок',female)}${stat('♂','Самцов',male)}${stat('◈','Молодняка',youngCount())}</div>
<div class="banner"><div><strong>Учёт поголовья в одном месте</strong><p>Животные, вязки, окролы, напоминания об отсадке и история.</p></div><button class="btn primary" onclick="openRabbit()">＋ Добавить кролика</button></div>
<div class="grid"><div><section class="panel"><div class="sectionrow"><h2>Требуют внимания</h2><span class="pill orange">${need.length} групп</span></div>${need.length?need.map(l=>row('Отсадить молодняк','Мать: '+(data.rabbits.find(r=>r.id===l.mother)?.name||'—')+' · '+days(l.born)+' дней',l.count+' шт.','orange',`<button class="btn" onclick="separate('${l.id}')">Отсадить</button>`)).join(''):empty('Всё спокойно','Нет групп молодняка старше 45 дней, ожидающих отсадки.')}</section>
<section class="panel"><div class="sectionrow"><h2>Последние животные</h2><button class="chip" onclick="go('adults')">Открыть всех →</button></div>${rabbits().slice(-5).reverse().map(r=>row(r.name,(r.sex||'')+' · клетка '+(r.cage||'не указана'),days(r.born)!=null?days(r.born)+' дн.':'Возраст не указан')).join('')||empty('Кроликов ещё нет','Добавьте первую карточку животного.','Добавить кролика','openRabbit()')}</section></div>
<div><section class="panel"><h2>Быстрые действия</h2><div style="display:grid;gap:9px"><button class="btn primary" onclick="openRabbit()">＋ Новый кролик</button><button class="btn" onclick="openMating()">♡ Записать вязку</button><button class="btn" onclick="openLitter()">◈ Добавить окрол</button><button class="btn" onclick="go('young')">◷ Проверить молодняк</button><button class="btn" onclick="download()">↓ Сохранить резервную копию</button></div></section><section class="panel"><h2>Данные</h2><p class="muted">RabbitFarm 2.0: новая версия для Android. Данные хранятся локально. Используйте резервные копии для переноса между устройствами.</p></section></div></div>`}
function adultView(){const all=rabbits().filter(r=>(genderFilter==='Все'||r.sex===genderFilter)&&([r.name,r.cage,r.notes].join(' ').toLowerCase().includes(search.toLowerCase())));return `${header('Взрослые кролики','Карточки самцов и самок, номера клеток и возраст','Добавить','openRabbit()')}<section class="panel"><div class="searchbox"><input class="search" placeholder="Поиск по имени, клетке..." value="${esc(search)}" oninput="search=this.value;renderKeepFocus()"></div><div class="chips">${['Все','Самка','Самец'].map(g=>`<button class="chip ${genderFilter===g?'active':''}" onclick="genderFilter='${g}';render()">${g==='Все'?'Все':g==='Самка'?'Самки':'Самцы'}</button>`).join('')}</div></section><div class="panel">${all.map(r=>row(r.name,`${r.sex} · Клетка ${r.cage||'—'} · ${days(r.born)==null?'Возраст не указан':days(r.born)+' дн.'}`,r.sex==='Самка'?'♀':'♂','',`<button class="btn" onclick="openRabbit('${r.id}')">Изменить</button>`)).join('')||empty('Пока нет животных','Добавьте первую карточку взрослого кролика.','Добавить кролика','openRabbit()')}</div>`}
function renderKeepFocus(){const p=document.activeElement?.selectionStart;render();const el=document.querySelector('.search');if(el){el.focus();el.setSelectionRange(p,p)}}
function youngView(){return `${header('Молодняк','Учёт окролов, возраста и отсадки на 45-й день','Добавить окрол','openLitter()')}<section class="panel">${litters().map(l=>{const m=data.rabbits.find(r=>r.id===l.mother),age=days(l.born),due=age==null?null:Math.max(0,45-age);return `<div class="item"><span class="avatar">◈</span><div class="detail"><b>Окрол: ${esc(m?.name||l.motherName||'—')}</b><small>Дата: ${russian(l.born)} · ${age??'—'} дн. · ${l.count} крольчат</small><small>Клетка: ${esc(l.cage||m?.cage||'—')}</small></div><span class="pill ${!l.separated&&age>=45?'orange':''}">${l.separated?'Отсажены':due===0?'Пора отсаживать':due+' дн. до отсадки'}</span><button class="btn" onclick="openLitter('${l.id}')">Правка</button></div>`}).join('')||empty('Молодняка пока нет','Добавьте окрол, указав мать, дату и количество крольчат.','Добавить окрол','openLitter()')}</section>`}
function matingView(){return `${header('Вязки','Учёт паровок, дат и ожидаемых окролов','Записать вязку','openMating()')}<section class="panel">${data.matings.slice().reverse().map(m=>{const f=data.rabbits.find(r=>r.id===m.f),p=data.rabbits.find(r=>r.id===m.m);return row((f?.name||m.femaleName||'Самка')+' × '+(p?.name||m.maleName||'Самец'),'Вязка: '+russian(m.date)+' · дата окрола ориентировочно '+russian(addDays(m.date,31)), 'Вязка','',`<button class="btn" onclick="openLitter('', '${m.f}')">Окрол</button>`)}).join('')||empty('Вязок пока нет','Записывайте самца, самку и дату вязки.','Добавить вязку','openMating()')}</section>`}
function addDays(date,n){if(!date)return '';const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function historyView(type){const rec=data.records.filter(r=>r.type===type).slice().reverse();return `${header(type,'История записей по кролиководству')}${type==='Продано'?'<section class="panel"><button class="btn primary" onclick="openRecord(\'Продано\')">＋ Записать продажу</button></section>':type==='На мясо'?'<section class="panel"><button class="btn primary" onclick="openRecord(\'На мясо\')">＋ Добавить запись</button></section>':'<section class="panel"><button class="btn primary" onclick="openRecord(\'Падёж\')">＋ Добавить запись</button></section>'}<section class="panel">${rec.map(r=>row(r.name,r.note+' · '+russian(r.date),r.count+' шт.',type==='Падёж'?'red':type==='Продано'?'':'orange')).join('')||empty('Записей нет','История заполнится после добавления событий.')}</section>`}
function allView(){const sold=data.records.filter(x=>x.type==='Продано').reduce((n,x)=>n+x.count,0),meat=data.records.filter(x=>x.type==='На мясо').reduce((n,x)=>n+x.count,0),dead=data.records.filter(x=>x.type==='Падёж').reduce((n,x)=>n+x.count,0);return `${header('За всё время','Общая статистика вашей фермы')}<div class="stats">${stat('🐇','Всего взрослых учтено',data.rabbits.length)}${stat('◈','Родилось крольчат',data.litters.reduce((n,l)=>n+(l.initial||l.count),0))}${stat('₽','Продано',sold+' шт.')}${stat('◷','Вязок записано',data.matings.length)}</div><section class="panel"><h2>Итоги событий</h2><div class="table-wrap"><table class="table"><tr><th>Показатель</th><th>Количество</th></tr><tr><td>В хозяйстве, взрослые</td><td>${adults()}</td></tr><tr><td>Молодняка сейчас</td><td>${youngCount()}</td></tr><tr><td>Продано</td><td>${sold}</td></tr><tr><td>На мясо</td><td>${meat}</td></tr><tr><td>Падёж</td><td>${dead}</td></tr></table></div></section><section class="panel"><div class="sectionrow"><h2>Резервная копия HTML-данных</h2></div><p class="muted">Импортируйте JSON из RabbitFarm 2.0 или файл rabbit_prefs.xml старого приложения. Старое приложение при этом не изменяется.</p><div class="actions"><button class="btn primary" onclick="download()">↓ Скачать JSON</button><label class="btn">↑ Импорт JSON / XML<input type="file" accept=".json,.xml,application/json,text/xml,application/xml" hidden onchange="upload(event)"></label></div></section>`}
function dialog(html){document.getElementById('dialog-content').innerHTML=html;document.getElementById('dlg').showModal()};const val=id=>document.getElementById(id)?.value?.trim()||'';
function openRabbit(id=''){const r=data.rabbits.find(x=>x.id===id);dialog(`<h2>${r?'Изменить кролика':'Добавить кролика'}</h2><div class="forms"><label class="field">Кличка / номер<input id="rn" value="${esc(r?.name||'')}" placeholder="Например: Белка" required></label><label class="field">Пол<select id="rs"><option ${r?.sex==='Самка'?'selected':''}>Самка</option><option ${r?.sex==='Самец'?'selected':''}>Самец</option></select></label><label class="field">Дата рождения<input id="rb" type="date" value="${esc(r?.born||'')}"></label><label class="field">Номер клетки<input id="rc" value="${esc(r?.cage||'')}" placeholder="Например: 12А"></label><label class="field span2">Примечание<textarea id="rnotes">${esc(r?.notes||'')}</textarea></label></div><div class="actions"><button class="btn primary" onclick="saveRabbit('${id}')">Сохранить</button>${r?`<button class="btn" onclick="archiveRabbit('${id}')">Убрать из поголовья</button>`:''}</div>`)}
function saveRabbit(id){const name=val('rn');if(!name)return alert('Введите кличку или номер');let r=data.rabbits.find(x=>x.id===id);if(!r){r={id:uid(),status:'В хозяйстве'};data.rabbits.push(r)}Object.assign(r,{name,sex:val('rs'),born:val('rb'),cage:val('rc'),notes:val('rnotes')});save();document.getElementById('dlg').close();render()}
function archiveRabbit(id){if(!confirm('Убрать животное из активного поголовья?'))return;const r=data.rabbits.find(r=>r.id===id);if(r)r.status='Выбыл';save();document.getElementById('dlg').close();render()}
const options=(arr,selected='')=>arr.map(r=>`<option value="${esc(r.id)}" ${selected===r.id?'selected':''}>${esc(r.name)}${r.cage?' · клетка '+esc(r.cage):''}</option>`).join('');
function openMating(){const fs=rabbits().filter(r=>r.sex==='Самка'),ms=rabbits().filter(r=>r.sex==='Самец');if(!fs.length||!ms.length)return alert('Сначала добавьте хотя бы одну самку и одного самца');dialog(`<h2>Записать вязку</h2><div class="forms"><label class="field">Самка<select id="mf">${options(fs)}</select></label><label class="field">Самец<select id="mm">${options(ms)}</select></label><label class="field span2">Дата вязки<input type="date" id="md" value="${today()}"></label></div><p class="hint">Примерная дата окрола рассчитывается через 31 день. Фактическую дату можно указать при добавлении окрола.</p><div class="actions"><button class="btn primary" onclick="saveMating()">Сохранить</button></div>`)}
function saveMating(){if(!val('mf')||!val('mm')||!val('md'))return alert('Заполните поля');data.matings.push({id:uid(),f:val('mf'),m:val('mm'),date:val('md')});save();document.getElementById('dlg').close();render()}
function openLitter(id='',motherId=''){const l=data.litters.find(x=>x.id===id);const fs=rabbits().filter(r=>r.sex==='Самка');if(!fs.length)return alert('Сначала добавьте самку');dialog(`<h2>${l?'Изменить окрол':'Новый окрол'}</h2><div class="forms"><label class="field">Мать<select id="lm">${options(fs,l?.mother||motherId)}</select></label><label class="field">Дата окрола<input type="date" id="lb" value="${l?.born||today()}"></label><label class="field">Количество крольчат<input type="number" min="0" step="1" id="lc" value="${l?.count??''}"></label><label class="field">Номер клетки<input id="lcell" value="${esc(l?.cage||'')}"></label><label class="field span2"><span><input type="checkbox" id="ls" ${l?.separated?'checked':''}> Молодняк отсажен от матери</span></label></div><p class="hint">Плановая отсадка — через 45 дней после окрола.</p><div class="actions"><button class="btn primary" onclick="saveLitter('${id}')">Сохранить</button></div>`)}
function saveLitter(id){const count=Number(val('lc'));if(!val('lm')||!val('lb')||!Number.isInteger(count)||count<0)return alert('Проверьте дату, мать и количество');let l=data.litters.find(x=>x.id===id);if(!l){l={id:uid(),initial:count};data.litters.push(l)}Object.assign(l,{mother:val('lm'),born:val('lb'),count,cage:val('lcell'),separated:document.getElementById('ls').checked});save();document.getElementById('dlg').close();render()}
function separate(id){const l=data.litters.find(l=>l.id===id);if(l&&confirm('Отметить молодняк как отсаженный?')){l.separated=true;save();render()}}
function openRecord(type){dialog(`<h2>${esc(type)} — новая запись</h2><div class="forms"><label class="field span2">Животное / группа<input id="re-name" placeholder="Кличка или мать молодняка"></label><label class="field">Количество<input type="number" id="re-count" value="1" min="1" step="1"></label><label class="field">Дата<input type="date" id="re-date" value="${today()}"></label><label class="field span2">Примечание<input id="re-note" placeholder="Покупатель, причина или комментарий"></label></div><div class="actions"><button class="btn primary" onclick="saveRecord('${type}')">Сохранить</button></div>`)}
function saveRecord(type){const count=Number(val('re-count'));if(!val('re-name')||!Number.isInteger(count)||count<1)return alert('Проверьте название и количество');data.records.push({id:uid(),type,count,name:val('re-name'),date:val('re-date'),note:val('re-note')});save();document.getElementById('dlg').close();render()}
function download(){if(window.AndroidBridge){window.AndroidBridge.saveBackup(JSON.stringify({app:'RabbitFarm Modern',version:2,data}));return;}const b=new Blob([JSON.stringify({app:'RabbitFarm Modern',version:2,data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rabbitfarm-html-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function upload(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
   const text=await file.text();const raw=text.trim();
   if(raw.startsWith('<')){
      const doc=new DOMParser().parseFromString(raw,'application/xml');
      if(doc.querySelector('parsererror'))throw Error('Ошибка XML');
      const sets={};doc.querySelectorAll('set[name]').forEach(el=>{sets[el.getAttribute('name')]=[...el.children].filter(x=>x.tagName==='string').map(x=>x.textContent||'')});
      if(!Array.isArray(sets.rabbit_list))throw Error('Это не данные старой версии RabbitFarm');
      if(confirm('Добавить записи из старой версии, не удаляя текущие данные?')){
        if(!importLegacySets(sets,true))alert('В файле нет записей для переноса.');
        else alert('Старые записи импортированы. Проверьте результаты.');
      }
   }else{
      const x=JSON.parse(raw);
      if(!['RabbitFarm Modern','RabbitFarm HTML Preview'].includes(x.app)||!Array.isArray(x.data?.rabbits))throw Error('Неподходящий файл');
      if(confirm('Объединить записи с данными из резервной копии?')){
        for(const k of ['rabbits','litters','matings','records']){const exists=new Set(data[k].map(v=>v.id));data[k].push(...(x.data[k]||[]).filter(v=>!exists.has(v.id)))}
        save();render();
      }
   }
 }catch(err){alert(err.message||'Ошибка импорта');}
 e.target.value='';
}
/* Переход со старых версий: импортируем только при пустой базе. Оригинальные SharedPreferences не изменяем. */
function isoLegacy(s){if(!s)return '';const t=String(s).trim();const m=t.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:t;}
function importLegacySets(sets, merge=false){
 if((!merge&&localStorage.getItem(KEY))||!sets||!Array.isArray(sets.rabbit_list))return false;
 const result={rabbits:[],litters:[],matings:[],records:[]};
 const byName=new Map();
 (sets.rabbit_list||[]).forEach((raw,index)=>{const a=raw.split('|'),id='old-r-'+index+'-'+String(a[0]).length;
  const rabbit={id,name:a[0]||'Без имени',sex:a[1]||'Самка',born:isoLegacy(a[2]),cage:'',notes:a[5]||'',legacyPhoto:a[4]||'',status:'В хозяйстве'};
  result.rabbits.push(rabbit);if(!byName.has(rabbit.name))byName.set(rabbit.name,id);});
 (sets.young_list||[]).forEach((raw,index)=>{const a=raw.split('|');result.litters.push({id:'old-l-'+index,mother:byName.get(a[1])||'',motherName:a[1]||'',born:isoLegacy(a[2]),count:Math.max(0,+a[3]||0),initial:Math.max(0,+a[3]||0),cage:'',separated:a[4]==='1'});});
 (sets.mating_list||[]).forEach((raw,index)=>{const a=raw.split('|');result.matings.push({id:'old-m-'+index,f:byName.get(a[1])||'',m:byName.get(a[2])||'',femaleName:a[1],maleName:a[2],date:isoLegacy(a[3])});});
 (sets.adult_sales||[]).forEach((raw,index)=>{const a=raw.split('|');result.records.push({id:'old-as-'+index,type:'Продано',name:a[1]||'Кролик',count:1,date:isoLegacy(a[5]),note:(a[4]?'Покупатель: '+a[4]+'; ':'')+'Сумма: '+(a[6]||'0')+' ₽'});});
 (sets.young_sales||[]).forEach((raw,index)=>{const a=raw.split('|');result.records.push({id:'old-ys-'+index,type:'Продано',name:'Молодняк от '+(a[1]||''),count:+a[3]||0,date:isoLegacy(a[5]),note:'Сумма: '+(a[6]||'0')+' ₽'});});
 (sets.meat_list||[]).forEach((raw,index)=>{const a=raw.split('|');result.records.push({id:'old-me-'+index,type:'На мясо',name:a[0]||'Кролик',count:1,date:'',note:'Из старой версии'});});
 (sets.adult_death_list||[]).forEach((raw,index)=>{const a=raw.split('|');result.records.push({id:'old-de-'+index,type:'Падёж',name:a[0]||'Кролик',count:1,date:'',note:'Из старой версии'});});
 if(!Object.values(result).some(v=>v.length))return false;
 if(merge){for(const name of ['rabbits','litters','matings','records']){const ids=new Set(data[name].map(v=>v.id));data[name].push(...result[name].filter(v=>!ids.has(v.id)));}}
 else data=result;
 save();render();return true;
}
try{if(window.AndroidBridge){importLegacySets(JSON.parse(window.AndroidBridge.getLegacyData()));}}catch(e){console.warn('Legacy import skipped',e)}

render();
</script></body></html>
