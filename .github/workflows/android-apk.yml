name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check embedded dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/rabbitfarm.html').read_text(encoding='utf-8')
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          Path('/tmp/rabbitfarm.js').write_text(html.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/rabbitfarm.js
      - name: Compile RabbitFarm APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RabbitFarm-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
